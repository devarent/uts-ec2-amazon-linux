# kind cluster dengan port mapping: host 8080 -> container NodePort 30080
# Jalankan: kind create cluster --config LAB/05-KUBERNETES/kind-cluster.yaml
kind: Cluster
apiVersion: kind.x-k8s.io/v1alpha4
name: uts-k8s
nodes:
  - role: control-plane
    extraPortMappings:
      - containerPort: 30080
        hostPort: 8080
        protocol: TCP
      - containerPort: 30443
        hostPort: 8443
        protocol: TCP
