apiVersion: v1
kind: ConfigMap
metadata:
  name: website-html
  namespace: uts
data:
  index.html: |
    <!DOCTYPE html>
    <html lang="id">
    <head>
      <meta charset="UTF-8">
      <meta name="viewport" content="width=device-width, initial-scale=1">
      <title>Kubernetes Lab — Muhammad Arya Fatthurahman</title>
      <style>
        body { font-family: ui-monospace, Menlo, Consolas, monospace; background:#0b1220; color:#d1e3ff; margin:0; padding:40px 16px; }
        .card { max-width: 760px; margin: 0 auto; background:#101a2f; border:1px solid #1f3260; border-radius:12px; padding:28px; box-shadow:0 8px 24px rgba(0,0,0,.4); }
        h1 { margin-top:0; color:#7dd3fc; font-size:24px; }
        h2 { font-size:16px; color:#93c5fd; border-bottom:1px solid #1f3260; padding-bottom:8px; }
        code { color:#86efac; background:#0a0f1f; padding:2px 6px; border-radius:6px; }
        .b { display:inline-block; background:#16a34a; color:#052e16; padding:2px 10px; border-radius:999px; font-weight:700; }
        table { border-collapse:collapse; width:100%; font-size:14px; }
        td { border:1px solid #1f3260; padding:8px 10px; }
        td:first-child { color:#7dd3fc; width:40%; }
      </style>
    </head>
    <body>
      <div class="card">
        <h1>KUBERNETES LAB — SERVER ONLINE <span class="b">RUNNING</span></h1>
        <p>Muhammad Arya Fatthurahman &middot; NIM <strong>2023230006</strong> &middot; Kelas TIFM</p>
        <p>Universitas Darma Persada (UNSADA) — Teknologi Informasi</p>

        <h2>Deployment</h2>
        <table>
          <tr><td>Platform</td><td>Kubernetes (kind / k3s single-node)</td></tr>
          <tr><td>Namespace</td><td><code>uts</code></td></tr>
          <tr><td>Workload</td><td>Deployment <code>website</code> (replicas: 2)</td></tr>
          <tr><td>Image</td><td>nginx:1.27-alpine</td></tr>
          <tr><td>Service</td><td>NodePort <code>30080</code> → container 80</td></tr>
        </table>

        <h2>Perintah yang dipakai</h2>
        <p><code>kind create cluster --config kind-cluster.yaml</code></p>
        <p><code>kubectl apply -k manifests/</code></p>
        <p><code>kubectl -n uts get pods -o wide</code></p>
        <p><code>kubectl -n uts logs -l app=website --tail=5</code></p>

        <h2>Konsep penting</h2>
        <p>Deployment (replica + self-healing) · Service (IP stabil, load-balancing) · ConfigMap (konfigurasi/HTML) · Namespace (isolasi) · NodePort (akses dari luar cluster).</p>
      </div>
    </body>
    </html>
