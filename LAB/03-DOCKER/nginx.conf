# =====================================================================
#  nginx.conf — virtual host untuk website statis UTS
# =====================================================================
server {
    listen       80;
    server_name  _;

    root         /usr/share/nginx/html;
    index        index.html index.htm;

    # Security headers sederhana
    add_header X-Frame-Options "SAMEORIGIN"        always;
    add_header X-Content-Type-Options "nosniff"    always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;

    # Jangan perbolehkan akses ke file tersembunyi (.env, .git, dll.)
    location ~ /\. {
        deny all;
    }

    # Cache untuk aset statis
    location ~* \.(css|js|png|jpg|jpeg|svg|webp|ico)$ {
        expires 7d;
        add_header Cache-Control "public, max-age=604800";
        try_files $uri =404;
    }

    location / {
        try_files $uri $uri/ =404;
    }

    # Halaman 404 sederhana
    error_page 404 /404.html;
}
