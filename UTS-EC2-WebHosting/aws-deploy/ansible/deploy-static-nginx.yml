---
# Ansible Playbook: Deploy Static Website to AWS EC2 with Nginx
# Referensi: builder.aws.com "Host a Website on AWS EC2 with Nginx"
# Tugas UTS Cloud Computing - Muhammad Arya Fatthurahman - NIM 2023230006 - TIFM

- name: Install Nginx & Deploy Static Website to AWS EC2
  hosts: web
  become: yes
  vars:
    app_dir: /var/www/html
    site_files: "{{ playbook_dir }}/site"

  tasks:
    - name: Update apt packages
      apt:
        update_cache: yes
        cache_valid_time: 3600

    - name: Install Nginx
      apt:
        name: nginx
        state: present

    - name: Start and enable Nginx
      service:
        name: nginx
        state: started
        enabled: yes

    - name: Deploy website files to Nginx web root
      copy:
        src: "{{ site_files }}/"
        dest: "{{ app_dir }}/"
        owner: www-data
        group: www-data
        mode: "0644"
        directory_mode: "0755"

    - name: Set ownership of web root
      file:
        path: "{{ app_dir }}"
        owner: www-data
        group: www-data
        recurse: yes
        state: directory

    - name: Ensure Nginx serves index.html
      lineinfile:
        path: /etc/nginx/sites-available/default
        regexp: '^\s*index '
        line: "    index index.html index.htm index.nginx-debian.html;"
      notify: reload nginx

    - name: Test Nginx configuration
      command: nginx -t
      changed_when: false

    - name: Reload Nginx
      service:
        name: nginx
        state: reloaded

    - name: Verify Nginx status
      command: systemctl is-active nginx
      register: nginx_status
      changed_when: false

    - name: Show deployment result
      debug:
        msg: "Website deployed! Nginx status: {{ nginx_status.stdout }}. Access via http://{{ ansible_host }}"

  handlers:
    - name: reload nginx
      service:
        name: nginx
        state: reloaded
