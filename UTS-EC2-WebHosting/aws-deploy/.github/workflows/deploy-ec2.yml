name: Deploy Static Site to AWS EC2

# Referensi: dev.to "CI/CD for Beginners: Deploy a Static HTML Site to AWS EC2 with GitHub Actions"
# Tugas UTS Cloud Computing - Muhammad Arya Fatthurahman - NIM 2023230006 - TIFM

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  deploy:
    name: Deploy website ke EC2
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Siapkan SSH key
        run: |
          mkdir -p ~/.ssh
          echo "${{ secrets.EC2_SSH_KEY }}" > ~/.ssh/deploy_key
          chmod 600 ~/.ssh/deploy_key
          ssh-keyscan -H "${{ secrets.EC2_HOST }}" >> ~/.ssh/known_hosts

      - name: Upload file website ke EC2
        run: |
          rsync -avz --delete \
            -e "ssh -i ~/.ssh/deploy_key -o StrictHostKeyChecking=yes" \
            ./ \
            "${{ secrets.EC2_USER }}@${{ secrets.EC2_HOST }}:/tmp/uts-site/"

      - name: Pindahkan ke web root & atur permission
        run: |
          ssh -i ~/.ssh/deploy_key "${{ secrets.EC2_USER }}@${{ secrets.EC2_HOST }}" <<'EOF'
          sudo rm -rf /var/www/html/*
          sudo mv /tmp/uts-site/* /var/www/html/
          sudo chown -R www-data:www-data /var/www/html
          sudo find /var/www/html -type d -exec chmod 755 {} \;
          sudo find /var/www/html -type f -exec chmod 644 {} \;
          sudo systemctl reload apache2 || sudo systemctl reload nginx
          echo "Deploy selesai: $(date -u +%FT%TZ)"
          EOF

      - name: Verifikasi website
        run: |
          curl -fsS "http://${{ secrets.EC2_HOST }}/" -o /dev/null && echo "Website OK"
