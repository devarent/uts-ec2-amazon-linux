# ------------------------------------------------------------------
# Default values. Override saat install:
#   helm upgrade --install nextjs ./helm/nextjs-app \
#     --set image.repository=ghcr.io/owner/repo \
#     --set image.tag=sha-abc1234 \
#     --set ingress.hosts[0].host=app.example.com
# ------------------------------------------------------------------

replicaCount: 2

image:
  repository: ghcr.io/owner/repo
  tag: latest
  pullPolicy: IfNotPresent

imagePullSecrets: []
nameOverride: ""
fullnameOverride: ""

serviceAccount:
  create: true
  annotations: {}
  name: ""

podAnnotations: {}
podLabels: {}

podSecurityContext:
  runAsNonRoot: true
  runAsUser: 1001
  runAsGroup: 1001
  fsGroup: 1001
  seccompProfile:
    type: RuntimeDefault

securityContext:
  allowPrivilegeEscalation: false
  privileged: false
  readOnlyRootFilesystem: true
  capabilities:
    drop:
      - ALL

service:
  type: ClusterIP
  port: 80
  targetPort: 3000

ingress:
  enabled: true
  className: nginx
  annotations:
    cert-manager.io/cluster-issuer: letsencrypt-prod
    nginx.ingress.kubernetes.io/proxy-body-size: "10m"
    nginx.ingress.kubernetes.io/ssl-redirect: "true"
  hosts:
    - host: app.example.com
      paths:
        - path: /
          pathType: Prefix
  tls:
    - secretName: nextjs-app-tls
      hosts:
        - app.example.com

resources:
  requests:
    cpu: 50m
    memory: 128Mi
  limits:
    cpu: 500m
    memory: 512Mi

# Container listens on 3000 (standalone server).
containerPort: 3000

probes:
  startup:
    enabled: true
    failureThreshold: 30
    periodSeconds: 2
  liveness:
    enabled: true
    initialDelaySeconds: 10
    periodSeconds: 15
    timeoutSeconds: 3
    failureThreshold: 3
  readiness:
    enabled: true
    initialDelaySeconds: 5
    periodSeconds: 10
    timeoutSeconds: 3
    failureThreshold: 3

autoscaling:
  enabled: true
  minReplicas: 2
  maxReplicas: 6
  targetCPUUtilizationPercentage: 70
  targetMemoryUtilizationPercentage: 80

podDisruptionBudget:
  enabled: true
  minAvailable: 1

# Non-secret env
env:
  NODE_ENV: production
  PORT: "3000"
  HOSTNAME: 0.0.0.0
  NEXT_PUBLIC_SITE_URL: https://app.example.com
  APP_VERSION: "1.0.0"
  # Set true bila /api/health harus gagal saat database down.
  # REQUIRE_DB: "true"

# Secret env — sebaiknya pakai External Secrets / Sealed Secrets,
# bukan values.yaml yang di-commit.
#
# Database TIDAK dibundel di chart ini. Isi DATABASE_URL lewat Secret,
# misalnya dari RDS/Aurora atau operator PostgreSQL:
#   kubectl create secret generic nextjs-db -n ec2-lab \
#     --from-literal=DATABASE_URL='postgres://user:pass@db-host:5432/ec2lab?sslmode=require'
# lalu:
#   --set secret.create=false --set secret.name=nextjs-db
#
# Jika memakai secret.create=true (hanya untuk lab), isi seperti ini:
secret:
  create: false
  name: ""
  data: {}
  # data:
  #   OPENAI_API_KEY: "sk-..."
  #   ADMIN_TOKEN: "token-acak"
  #   DATABASE_URL: "postgres://user:pass@db-host:5432/ec2lab?sslmode=require"

nodeSelector: {}
tolerations: []

affinity: {}

topologySpreadConstraints:
  - maxSkew: 1
    topologyKey: topology.kubernetes.io/zone
    whenUnsatisfiable: ScheduleAnyway
    labelSelector:
      matchLabels: {}

terminationGracePeriodSeconds: 30
revisionHistoryLimit: 3
