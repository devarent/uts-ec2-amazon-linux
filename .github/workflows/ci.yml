name: CI

on:
  push:
    branches: [main]
    paths:
      - "app/**"
      - "package.json"
      - ".github/workflows/ci.yml"
  pull_request:
    paths:
      - "app/**"
      - ".github/workflows/ci.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Typecheck & build
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: app/package-lock.json

      - name: Install dependencies
        working-directory: app
        run: npm ci

      - name: Typecheck
        working-directory: app
        run: npm run typecheck

      - name: Build
        working-directory: app
        env:
          NEXT_PUBLIC_SITE_URL: https://app.example.com
          NEXT_TELEMETRY_DISABLED: "1"
        run: npm run build

      - name: Verify standalone output
        working-directory: app
        run: test -f .next/standalone/server.js

  docker:
    name: Docker build (no push)
    runs-on: ubuntu-latest
    timeout-minutes: 20
    needs: build

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build image
        uses: docker/build-push-action@v6
        with:
          context: ./app
          push: false
          load: true
          tags: ec2-lab:ci
          build-args: |
            NEXT_PUBLIC_SITE_URL=https://app.example.com
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Smoke test (app + PostgreSQL)
        run: |
          set -euo pipefail
          docker network create ci-net
          docker run -d --name smoke-db --network ci-net \
            -e POSTGRES_DB=ec2lab \
            -e POSTGRES_USER=ec2lab \
            -e POSTGRES_PASSWORD=ci_password \
            postgres:17-alpine

          for i in $(seq 1 30); do
            if docker exec smoke-db pg_isready -U ec2lab -d ec2lab >/dev/null 2>&1; then break; fi
            sleep 2
          done

          docker run -d --name smoke --network ci-net -p 3000:3000 \
            -e DATABASE_URL=postgres://ec2lab:ci_password@smoke-db:5432/ec2lab \
            -e REQUIRE_DB=true \
            ec2-lab:ci

          healthy=0
          for i in $(seq 1 30); do
            if curl -fsS http://127.0.0.1:3000/api/health >/dev/null 2>&1; then
              healthy=1
              break
            fi
            sleep 2
          done

          if [ "$healthy" -ne 1 ]; then
            echo "Health check gagal"
            docker logs smoke || true
            docker logs smoke-db || true
            exit 1
          fi

          curl -fsS http://127.0.0.1:3000/api/health
          curl -fsS http://127.0.0.1:3000/api/guestbook
          curl -fsS -X POST -H 'Content-Type: application/json' \
            -d '{"name":"CI","message":"smoke test dari GitHub Actions"}' \
            http://127.0.0.1:3000/api/guestbook
          curl -fsS http://127.0.0.1:3000/api/guestbook | grep -q "smoke test"

      - name: Cleanup
        if: always()
        run: |
          docker rm -f smoke smoke-db || true
          docker network rm ci-net || true
